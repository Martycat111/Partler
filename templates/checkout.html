<!DOCTYPE html>
<html>
  <head>
    <link href="/css/global.css" rel="stylesheet"/>
    <link href="/css/checkout.css" rel="stylesheet"/>
    <script src="/js/checkout.js"></script>
  </head>

  <body class="center">

    <a href="/">
    <button class="backbutton">
      <img src="img/back.png">
      <p>back</p>
    </button>
    </a>

    <titletext>Check-out parts here! </titletext>
    <div class="items">
        % for i in range(len(names)):
            <div class="itemholder">
                %if images[i] != None:
                    <img class="itemimage" src="{{"img/" + images[i]}}">
                %end
                %if images[i] == None:
                    <img class="itemimage" src="img/noimg.png">
                %end
                <div class="itemtextarea">
                  <p class="itemname">{{names[i]}}</p>

                  <input
                  onChange="update_running_total()"
                  class="numberInput"
                  type="number"
                  value="0"
                  name="numberInput"
                  min="0"
                  max="{{counts[i]}}">

                  <p class="available-amount">/ {{counts[i]}}</p>

                  
                </div>
            </div>
        % end

        <footer class="bottombar">
          <button class="checkout-button" onclick="checkout()">
            <p>Check out!</p>
          </button>
          <p class="total">Running total: 0</p>
        </footer>
    </div>

  </body>

</html>
