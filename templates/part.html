<!DOCTYPE html>
<html>
  <head>
    <link href="/css/part.css" rel="stylesheet"/>
  </head>

  <body class="center">

    <a href="/">
    <button class="backbutton">
      <img src="img/back.png">
      <p>back</p>
    </button>
    </a>

    <titletext>Your parts are: </titletext>
    <div class="items">
        % for i in range(len(names)):
            <div class="itemholder">
                %if images[i] != None:
                    <img class="itemimage" src="{{"img/" + images[i]}}">
                %end
                %if images[i] == None:
                    <img class="itemimage" src="img/noimg.png">
                %end
                <div class="itemtextarea">
                  <p class="itemname">{{names[i]}}</p>

                  <div class="countinput" >
                    <input
                    disabled="true"
                    class="numberInput"
                    type="number"
                    value="{{counts[i]}}"
                    name="numberInput"
                    id="input"
                    step="1">
                  </div>

                </div>
            </div>
        % end
    </div>

  </body>

</html>
